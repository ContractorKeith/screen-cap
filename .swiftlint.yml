included:
  - App
  - Packages
  - scripts
  - Package.swift
excluded:
  - .build
  - build

line_length:
  warning: 120
  error: 160
  ignores_urls: true

identifier_name:
  excluded: [x, y, dx, dy, id]

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - sorted_imports
  - vertical_whitespace_closing_braces
