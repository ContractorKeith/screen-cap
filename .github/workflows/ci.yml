name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bundle.sh sets CFBundleVersion from the commit count
      - name: Toolchain
        run: |
          xcode-select -p
          swift --version
      - name: Build
        run: swift build
      # Build first so bundle/security regression tests execute against the shipped artifact (#157).
      - name: Bundle
        run: make bundle
      # Fast tier: slow end-to-end suites run nightly (nightly.yml) and before a release (#140).
      - name: Test
        timeout-minutes: 15
        run: make test
      - name: SwiftLint
        run: |
          command -v swiftlint || brew install swiftlint
          swiftlint --strict --reporter github-actions-logging
      - name: Check bundle
        run: scripts/check-bundle.sh build/ScreenCap.app
      - name: Launch smoke test
        run: |
          # Launches the bundled binary (dyld must find the embedded Sparkle) with a bad --capture value:
          # it must exit 3 ("not started") on its own. Needs no Screen Recording permission.
          status=0
          perl -e 'alarm 60; exec @ARGV' build/ScreenCap.app/Contents/MacOS/ScreenCap --capture bogus --quit || status=$?
          echo "exit status $status"
          [ "$status" -eq 3 ]
          # A bad --region with --quit is a usage error too, never the interactive overlay (#119, #135).
          status=0
          perl -e 'alarm 60; exec @ARGV' build/ScreenCap.app/Contents/MacOS/ScreenCap \
            --capture scrolling --region nan,0,100,100 --quit || status=$?
          echo "exit status $status"
          [ "$status" -eq 3 ]
